<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SqlTiger Admin Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #1e293b;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --code-bg: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .logo {
      padding: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #1e3a8a;
      color: #60a5fa;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    nav {
      padding: 15px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #334155; color: var(--text); }
    .nav-btn.active { background: var(--primary); color: #fff; font-weight: 600; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }
    h2 { font-size: 1.4rem; font-weight: 600; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover { background: #475569; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    th { background: #0f172a; color: var(--text-muted); font-weight: 600; }
    tr:nth-child(even) { background: #182234; }
    textarea, input, select {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    textarea {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 180px;
      line-height: 1.4;
    }
    .console-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  </style>
</head>
<body>
  <aside>
    <div class="logo">
      <span>SqlTiger</span>
      <span class="badge">OLTP + SP</span>
    </div>
    <nav>
      <button class="nav-btn active" onclick="switchView('tables')">
        <span>Tables & Records</span>
        <span id="nav-tables-count">0</span>
      </button>
      <button class="nav-btn" onclick="switchView('procedures')">
        <span>Stored Procedures</span>
        <span id="nav-procs-count">0</span>
      </button>
    </nav>
    <div style="padding: 15px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border);">
      Engine: <span id="engine-type" style="color: #60a5fa;">Memory (Pure Go)</span><br>
      PocketBase Style Single Binary
    </div>
  </aside>

  <main>
    <!-- View: Tables -->
    <div id="view-tables">
      <div class="header-bar">
        <h2>Tables & Data Records</h2>
        <button class="btn" onclick="seedSampleData()">Seed Sample Accounts Table</button>
      </div>

      <div style="margin-top: 20px; display: flex; gap: 15px;">
        <select id="table-select" style="max-width: 300px;" onchange="loadRecords()">
          <option value="">-- Select Table --</option>
        </select>
        <button class="btn btn-secondary" onclick="loadTables()">Refresh</button>
      </div>

      <div class="card" style="margin-top: 15px;">
        <h3 id="current-table-title" style="font-size: 1.1rem; color: var(--text-muted);">Records</h3>
        <div style="overflow-x: auto;">
          <table id="records-table">
            <thead><tr><th>No records loaded</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- View: Procedures -->
    <div id="view-procedures" style="display: none;">
      <div class="header-bar">
        <h2>Stored Procedure Studio</h2>
      </div>

      <div class="grid-2" style="margin-top: 20px;">
        <div class="card">
          <h3 style="font-size: 1rem; margin-bottom: 10px;">Register New Procedure (T-SQL)</h3>
          <textarea id="proc-sql-input">CREATE PROCEDURE TransferFunds
    @from INT,
    @to INT,
    @amount INT
AS
BEGIN
    DECLARE @sender_bal INT;
    SELECT balance INTO @sender_bal FROM accounts WHERE id = @from;

    IF @sender_bal < @amount
    BEGIN
        RAISERROR('Insufficient balance');
        RETURN -1;
    END

    UPDATE accounts SET balance = balance - @amount WHERE id = @from;
    UPDATE accounts SET balance = balance + @amount WHERE id = @to;
    PRINT 'Transfer successfully completed!';
    RETURN 0;
END;</textarea>
          <button class="btn" onclick="registerProcedure()">Register Stored Procedure</button>
        </div>

        <div class="card">
          <h3 style="font-size: 1rem; margin-bottom: 10px;">Execute Stored Procedure</h3>
          <label style="font-size: 0.85rem; color: var(--text-muted);">Select Procedure:</label>
          <select id="proc-select" onchange="renderParamInputs()">
            <option value="">-- Select Procedure --</option>
          </select>

          <div id="proc-params-container" style="margin-top: 10px;"></div>

          <button class="btn" style="background: var(--success);" onclick="executeProcedure()">
            Execute (Ambient ACID Transaction)
          </button>

          <h4 style="font-size: 0.85rem; margin-top: 20px; color: var(--text-muted);">Execution Result & Logs:</h4>
          <div id="console-output" class="console-box" style="margin-top: 8px;">Ready.</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let proceduresList = [];

    function switchView(view) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (view === 'tables') {
        document.getElementById('view-tables').style.display = 'block';
        document.getElementById('view-procedures').style.display = 'none';
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        loadTables();
      } else {
        document.getElementById('view-tables').style.display = 'none';
        document.getElementById('view-procedures').style.display = 'block';
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        loadProcedures();
      }
    }

    async function loadTables() {
      try {
        const res = await fetch('/api/tables');
        const data = await res.json();
        const sel = document.getElementById('table-select');
        sel.innerHTML = '<option value="">-- Select Table --</option>';
        document.getElementById('nav-tables-count').innerText = data.length;
        data.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.name;
          opt.innerText = t.name;
          sel.appendChild(opt);
        });
        if (data.length > 0) {
          sel.value = data[0].name;
          loadRecords();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadRecords() {
      const tbl = document.getElementById('table-select').value;
      if (!tbl) return;
      document.getElementById('current-table-title').innerText = 'Table: ' + tbl;
      try {
        const res = await fetch(`/api/tables/${tbl}/records`);
        const data = await res.json();
        const tableEl = document.getElementById('records-table');
        if (data.records.length === 0) {
          tableEl.innerHTML = '<thead><tr><th>No records found in ' + tbl + '</th></tr></thead><tbody></tbody>';
          return;
        }
        const cols = Object.keys(data.records[0]);
        let thead = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
        let tbody = data.records.map(r => {
          return '<tr>' + cols.map(c => `<td>${r[c] !== undefined ? r[c] : 'NULL'}</td>`).join('') + '</tr>';
        }).join('');
        tableEl.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
      } catch (err) {
        console.error(err);
      }
    }

    async function loadProcedures() {
      try {
        const res = await fetch('/api/procs');
        proceduresList = await res.json();
        document.getElementById('nav-procs-count').innerText = proceduresList.length;
        const sel = document.getElementById('proc-select');
        sel.innerHTML = '<option value="">-- Select Procedure --</option>';
        proceduresList.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.innerText = p.name;
          sel.appendChild(opt);
        });
        renderParamInputs();
      } catch (err) {
        console.error(err);
      }
    }

    function renderParamInputs() {
      const name = document.getElementById('proc-select').value;
      const container = document.getElementById('proc-params-container');
      container.innerHTML = '';
      const proc = proceduresList.find(p => p.name === name);
      if (!proc || !proc.params) return;

      proc.params.forEach(param => {
        const div = document.createElement('div');
        div.innerHTML = `<label style="font-size:0.8rem; color:var(--text-muted);">${param.name}:</label>
                         <input type="text" id="input-${param.name}" placeholder="Value for ${param.name}" />`;
        container.appendChild(div);
      });
    }

    async function registerProcedure() {
      const sql = document.getElementById('proc-sql-input').value;
      try {
        const res = await fetch('/api/procs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: sql })
        });
        const out = await res.json();
        if (res.ok) {
          alert(`Procedure '${out.name}' registered successfully!`);
          loadProcedures();
        } else {
          alert(`Error: ${out.error}`);
        }
      } catch (err) {
        alert(err);
      }
    }

    async function executeProcedure() {
      const name = document.getElementById('proc-select').value;
      if (!name) return alert('Select a procedure first');
      const proc = proceduresList.find(p => p.name === name);
      const args = {};
      if (proc && proc.params) {
        proc.params.forEach(p => {
          const val = document.getElementById(`input-${p.name}`).value;
          args[p.name] = isNaN(val) ? val : Number(val);
        });
      }

      const outBox = document.getElementById('console-output');
      outBox.innerText = `Executing procedure '${name}'...`;

      try {
        const res = await fetch(`/api/procs/${name}/exec`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ args: args })
        });
        const out = await res.json();
        outBox.innerText = JSON.stringify(out, null, 2);
      } catch (err) {
        outBox.innerText = 'Execution error: ' + err;
      }
    }

    async function seedSampleData() {
      try {
        const res = await fetch('/api/seed', { method: 'POST' });
        const out = await res.json();
        alert(out.message || 'Sample seeded!');
        loadTables();
      } catch (err) {
        alert(err);
      }
    }

    // Init
    loadTables();
    loadProcedures();
  </script>
</body>
</html>
