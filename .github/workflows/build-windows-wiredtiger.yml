name: Build Windows WiredTiger DLL & Verify Cgo

on:
  workflow_dispatch:
    inputs:
      wt_version:
        description: 'WiredTiger Git branch or tag'
        required: true
        default: '11.3.1'
  push:
    paths:
      - '.github/workflows/build-windows-wiredtiger.yml'
      - 'scripts/build_wiredtiger_windows*.sh'

permissions:
  contents: write

jobs:
  build-wiredtiger-dll:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout LionSQL repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add Pre-installed MinGW to PATH (for Cgo linking)
        run: |
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "C:\msys64\usr\bin" >> $GITHUB_PATH

      - name: Clone WiredTiger source
        run: |
          WT_VER="${{ github.event.inputs.wt_version || '11.3.1' }}"
          echo "Cloning WiredTiger v${WT_VER} into ./wt_source..."
          git clone --depth 1 --branch "${WT_VER}" https://github.com/wiredtiger/wiredtiger.git wt_source

      - name: Build WiredTiger Shared DLL via MSVC (/MT Static CRT)
        run: |
          cd wt_source

          # Guard Python3 Development component check in base.cmake
          sed -i 's/source_python3_package.*/set(python_version "3.10")/' cmake/configs/base.cmake

          mkdir -p build && cd build

          echo "Configuring CMake with Visual Studio 2022 x64..."
          cmake .. -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DENABLE_SHARED=1 \
            -DENABLE_STATIC=0 \
            -DENABLE_PYTHON=0 \
            -DENABLE_SNAPPY=0 \
            -DENABLE_LZ4=0 \
            -DENABLE_ZLIB=0 \
            -DENABLE_ZSTD=0

          echo "Building wiredtiger_shared target..."
          cmake --build . --config Release --target wiredtiger_shared

      - name: Generate MinGW-compatible Import Library (.dll.a)
        run: |
          DLL_PATH=$(find wt_source/build -name "wiredtiger.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "Error: wiredtiger.dll not found in build tree"
            exit 1
          fi
          echo "Found DLL at: $DLL_PATH"
          mkdir -p pkg/storage/wiredtiger/lib/windows_amd64/include

          # Copy DLL, MSVC .lib, and headers
          cp -v "$DLL_PATH" pkg/storage/wiredtiger/lib/windows_amd64/
          find wt_source/build -name "wiredtiger.lib" -exec cp -v {} pkg/storage/wiredtiger/lib/windows_amd64/ \; 2>/dev/null || true
          find wt_source -name "wiredtiger.h" -exec cp -v {} pkg/storage/wiredtiger/lib/windows_amd64/include/ \;
          find wt_source -name "wiredtiger_ext.h" -exec cp -v {} pkg/storage/wiredtiger/lib/windows_amd64/include/ \; 2>/dev/null || true

          cd pkg/storage/wiredtiger/lib/windows_amd64

          # Extract exports from DLL using dumpbin and generate MinGW libwiredtiger.dll.a
          python -c "
import subprocess
out = subprocess.check_output(['dumpbin', '/EXPORTS', 'wiredtiger.dll']).decode('utf-8', errors='ignore')
lines = ['EXPORTS\n']
for line in out.splitlines():
    parts = line.strip().split()
    if len(parts) >= 4 and parts[0].isdigit():
        lines.append(f'    {parts[3]}\n')
open('wiredtiger.def', 'w').writelines(lines)
"
          cat wiredtiger.def
          dlltool -d wiredtiger.def -l libwiredtiger.dll.a -D wiredtiger.dll
          ls -lh

      - name: Commit and Push Vendored DLL to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/storage/wiredtiger/lib/windows_amd64/
          git status
          git diff --staged --quiet || git commit -m "chore(storage/wiredtiger): vendor precompiled windows msvc dll and import library"
          git push origin main

      - name: Compile LionSQL Windows Executable with WiredTiger Cgo
        run: |
          export CC="gcc"
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64

          mkdir -p bin
          echo "Building lionsql.exe with -tags wiredtiger..."
          go build -tags wiredtiger -v -ldflags "-s -w" -buildvcs=false -o bin/lionsql.exe ./cmd/lionsql

          # Copy DLL next to executable for execution tests
          cp pkg/storage/wiredtiger/lib/windows_amd64/wiredtiger.dll bin/
          ls -lh bin/

      - name: Verify Windows Binary & WiredTiger Engine
        run: |
          export PATH="$(pwd)/bin:$PATH"
          ./bin/lionsql.exe --version || true
          ./bin/lionsql.exe --doctor || true

          echo "Running WiredTiger storage unit tests on Windows..."
          export CGO_ENABLED=1
          export CC="gcc"
          go test -tags wiredtiger -v -run TestWT_ ./pkg/storage/wiredtiger/...

      - name: Upload Windows WiredTiger Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lionsql-windows-wiredtiger-x64
          path: |
            bin/lionsql.exe
            pkg/storage/wiredtiger/lib/windows_amd64/wiredtiger.dll
            pkg/storage/wiredtiger/lib/windows_amd64/libwiredtiger.dll.a
            pkg/storage/wiredtiger/lib/windows_amd64/include/wiredtiger.h
