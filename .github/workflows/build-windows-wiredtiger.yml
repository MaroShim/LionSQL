name: Build Windows WiredTiger DLL & Verify Cgo

on:
  workflow_dispatch:
    inputs:
      wt_version:
        description: 'WiredTiger Git branch or tag'
        required: true
        default: '11.3.1'
  push:
    paths:
      - '.github/workflows/build-windows-wiredtiger.yml'
      - 'scripts/build_wiredtiger_windows*'

permissions:
  contents: write

jobs:
  build-wiredtiger-dll:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout LionSQL repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone WiredTiger source
        run: |
          $ver = "${{ github.event.inputs.wt_version }}"
          if (-not $ver) { $ver = "11.3.1" }
          Write-Host "Cloning WiredTiger v$ver into ./wt_source..."
          git clone --depth 1 --branch $ver https://github.com/wiredtiger/wiredtiger.git wt_source

      - name: Build WiredTiger Shared DLL via MSVC and Export Import Library
        run: |
          Write-Host "Compiler location: $(Get-Command cl.exe | Select-Object -ExpandProperty Source)"
          Write-Host "Ninja location: $(Get-Command ninja.exe | Select-Object -ExpandProperty Source)"

          # 1. Patch base.cmake to bypass Python3 development component check
          $baseCmake = "wt_source/cmake/configs/base.cmake"
          $c = Get-Content $baseCmake -Raw
          $c = $c -replace 'source_python3_package\(.*?\)', "`nset(python_version `"3.10`")`nset(default_enable_python OFF)`n"
          Set-Content -Path $baseCmake -Value $c -NoNewline
          Write-Host "Successfully patched base.cmake"

          # 2. Patch x86/windows/config.cmake to enable SHARED DLL and disable STATIC library
          $winConfig = "wt_source/cmake/configs/x86/windows/config.cmake"
          $w = Get-Content $winConfig -Raw
          $w = $w -replace 'set\(ENABLE_STATIC ON.*?\)', "`nset(ENABLE_STATIC OFF CACHE BOOL `"`" FORCE)`n"
          $w = $w -replace 'set\(ENABLE_SHARED OFF.*?\)', "`nset(ENABLE_SHARED ON CACHE BOOL `"`" FORCE)`n"
          Set-Content -Path $winConfig -Value $w -NoNewline
          Write-Host "Successfully patched x86/windows/config.cmake"

          # 3. Configure CMake with Ninja + MSVC cl.exe toolchain
          New-Item -ItemType Directory -Force -Path wt_source/build | Out-Null
          Set-Location wt_source/build

          Write-Host "Configuring CMake with Ninja + MSVC cl.exe (/MT)..."
          cmake .. -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="../cmake/toolchains/cl.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DENABLE_SHARED=1 `
            -DENABLE_STATIC=0 `
            -DENABLE_PYTHON=0 `
            -DENABLE_SNAPPY=0 `
            -DENABLE_LZ4=0 `
            -DENABLE_ZLIB=0 `
            -DENABLE_ZSTD=0

          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed with exit code $LASTEXITCODE" }

          # 4. Build wiredtiger via Ninja
          Write-Host "Building wiredtiger targets via Ninja..."
          cmake --build . --config Release --target wiredtiger_shared
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Building default target..."
              cmake --build . --config Release
          }

          # 5. Copy DLL, LIB, and headers to target directory
          $TargetDir = "$env:GITHUB_WORKSPACE/pkg/storage/wiredtiger/lib/windows_amd64"
          New-Item -ItemType Directory -Force -Path "$TargetDir/include" | Out-Null

          $builtDll = (Get-ChildItem -Path . -Recurse -Filter "wiredtiger.dll" | Select-Object -First 1)
          if ($builtDll) {
              Write-Host "Found built DLL: $($builtDll.FullName)"
              Copy-Item $builtDll.FullName -Destination "$TargetDir/wiredtiger.dll" -Force
          } else {
              throw "Error: wiredtiger.dll not found in build outputs!"
          }

          $builtLib = (Get-ChildItem -Path . -Recurse -Filter "wiredtiger.lib" | Select-Object -First 1)
          if ($builtLib) {
              Write-Host "Found built LIB: $($builtLib.FullName)"
              Copy-Item $builtLib.FullName -Destination "$TargetDir/wiredtiger.lib" -Force
          }

          $header = (Get-ChildItem -Path .. -Recurse -Filter "wiredtiger.h" | Select-Object -First 1).FullName
          Copy-Item $header -Destination "$TargetDir/include/wiredtiger.h" -Force

          $extHeader = (Get-ChildItem -Path .. -Recurse -Filter "wiredtiger_ext.h" | Select-Object -First 1)
          if ($extHeader) {
              Copy-Item $extHeader.FullName -Destination "$TargetDir/include/wiredtiger_ext.h" -Force
          }

          # 6. Generate MinGW-compatible libwiredtiger.dll.a using WiredTiger official def
          Copy-Item ../cmake/configs/wiredtiger.def "$TargetDir/wiredtiger.def" -Force
          Set-Location $TargetDir

          $dlltool = "dlltool"
          if (-not (Get-Command dlltool -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\msys64\mingw64\bin\dlltool.exe") {
                  $dlltool = "C:\msys64\mingw64\bin\dlltool.exe"
              } elseif (Test-Path "C:\Program Files\Git\mingw64\bin\dlltool.exe") {
                  $dlltool = "C:\Program Files\Git\mingw64\bin\dlltool.exe"
              }
          }
          Write-Host "Using dlltool: $dlltool"
          & $dlltool -d wiredtiger.def -l libwiredtiger.dll.a -D wiredtiger.dll
          if ($LASTEXITCODE -ne 0) { throw "dlltool failed with exit code $LASTEXITCODE" }

          Write-Host "Contents of $TargetDir :"
          Get-ChildItem -Path $TargetDir

      - name: Commit and Push Vendored DLL to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/storage/wiredtiger/lib/windows_amd64/
          git status
          $diff = git diff --staged --name-only
          if ($diff) {
              Write-Host "Committing vendored Windows WiredTiger DLL..."
              git commit -m "chore(storage/wiredtiger): vendor precompiled windows msvc dll and import library"
              git push origin main
          } else {
              Write-Host "No changes to commit (already up to date)."
          }

      - name: Compile LionSQL Windows Executable with WiredTiger Cgo
        run: |
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CC = "gcc"
          $env:Path = "C:\msys64\mingw64\bin;C:\Program Files\Git\mingw64\bin;" + $env:Path

          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Write-Host "Building lionsql.exe with Cgo -tags wiredtiger..."
          go build -tags wiredtiger -v -ldflags "-s -w" -buildvcs=false -o bin/lionsql.exe ./cmd/lionsql
          if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" }

          Copy-Item pkg/storage/wiredtiger/lib/windows_amd64/wiredtiger.dll bin/ -Force
          Write-Host "Bin directory contents:"
          Get-ChildItem bin/

      - name: Verify Windows Binary & WiredTiger Engine
        run: |
          $env:Path = "$pwd/bin;C:\msys64\mingw64\bin;C:\Program Files\Git\mingw64\bin;" + $env:Path
          Write-Host "Checking lionsql.exe version..."
          ./bin/lionsql.exe --version
          ./bin/lionsql.exe --doctor

          Write-Host "Running WiredTiger storage unit tests on Windows..."
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          go test -tags wiredtiger -v -run TestWT_ ./pkg/storage/wiredtiger/...
          if ($LASTEXITCODE -ne 0) { throw "go test failed with exit code $LASTEXITCODE" }

      - name: Upload Windows WiredTiger Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lionsql-windows-wiredtiger-x64
          path: |
            bin/lionsql.exe
            pkg/storage/wiredtiger/lib/windows_amd64/wiredtiger.dll
            pkg/storage/wiredtiger/lib/windows_amd64/libwiredtiger.dll.a
            pkg/storage/wiredtiger/lib/windows_amd64/include/wiredtiger.h
